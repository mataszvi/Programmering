  var player = { x: 500, y: 400, size: 40, color: "blue", speedX:-10, speedY:-3 }; // när man använder - en number den kommer att gå upp istället än närot
  function update() {
     clearScreen() //när man tar det bort den visar alla andra circlar bakom sig när det går nånstans

  }
