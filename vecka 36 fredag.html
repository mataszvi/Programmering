<body>
  <script src="http://koda.nu/simple.js">

  var player = {x: 500, y: 400, size: 40, color: "blue", speedX: 2, speedY: 4, directionX: -1, directionY: 1}  // när man använder - en number den kommer att gå upp istället än närot,
                                                                                //man kan säga att då störe numbr dås mer den kommer gå back som a reverse turn
 
 

var enemy= {
    x:100,
    y:100,
    bredd:50,
    hojd: 50,
    color: "red",
    speedX: 5,
    speedY: 0,
    directionX: 1 ,
    directionY: -1,

}


 
 
                                                                                function update() {

     clearScreen() //när man tar det bort den visar alla andra circlar bakom sig när det går nånstans
     circle(player.x, player.y, player.size, player.color);
    player.x = player.x + player.speedX * player.directionX
    player.y = player.y + player.speedY * player.directionY

    rectangle( enemy.x, enemy.y, enemy.bredd, enemy.hojd, enemy.color)
    // enemy.x = enemy.x + enemy.speedX * enemy.directionX
    setTimeout(() => {
        enemy.x = enemy.x + mouse.x / 100
    }, 1000)


    enemy.y = enemy.y + enemy.speedY * enemy.directionY

    console.log(player.x)

  }

 
   
  </script>
